<!DOCTYPE html>
<!--
  LLM Comparison Interface

  Sends the same system + user prompt to four LLMs in parallel and shows their
  responses side by side.

  IMPORTANT: Serve this through a local server (e.g. VS Code Live Server).
  Opening as file:// will fail because browsers block fetch() on file URLs and
  the API responses depend on CORS, which file:// doesn't satisfy.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Comparison</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Banner shown only if config.js is missing keys. Toggled by validateConfig() in script.js. -->
  <div id="config-warning" class="config-warning hidden">
    Some API keys are missing in <code>config.js</code>. Fill them in to enable those models.
  </div>

  <!-- Page title and subtitle. -->
  <header class="app-header">
    <h1>LLM Comparison</h1>
    <p class="subtitle">Send the same prompt to 4 models in parallel.</p>
  </header>

  <main class="container">
    <!-- Prompt inputs and action buttons. -->
    <section class="prompt-area">
      <!-- System prompt: shapes the model's role/tone. Optional. -->
      <label for="system-prompt">System Prompt</label>
      <textarea id="system-prompt" rows="3" placeholder="Optional system instructions sent to all models..."></textarea>

      <!-- User prompt: the actual question/task. Required. -->
      <label for="user-prompt">User Prompt</label>
      <textarea id="user-prompt" rows="6" placeholder="Your test prompt..."></textarea>

      <div class="actions">
        <!-- Fires all four model requests via Promise.all. -->
        <button id="send-btn" class="primary">Send to All</button>
        <!-- Disabled until at least one run has completed. Downloads lastRun as JSON. -->
        <button id="export-btn" class="secondary" disabled>Export JSON</button>
      </div>
    </section>

    <!-- Response grid: one card per model, populated by buildGrid() in script.js. -->
    <section class="grid" id="response-grid"></section>

    <!-- Collapsible session history. Each click on an item restores that run. -->
    <section class="history">
      <details>
        <summary>Session History (<span id="history-count">0</span>)</summary>
        <ul id="history-list"></ul>
      </details>
    </section>
  </main>

  <!--
    Load order matters: config.js defines the global CONFIG object that
    script.js reads on DOMContentLoaded, so it must come first.
  -->
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
